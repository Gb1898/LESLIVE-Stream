<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LES Live Stream</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

<iframe id="player" allow="autoplay; fullscreen"></iframe>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcHWGBSNu9LJUHhbahQqKDpNZYSufza90",
  authDomain: "les-live.firebaseapp.com",
  databaseURL: "https://les-live-default-rtdb.firebaseio.com",
  projectId: "les-live",
  appId: "1:76711441074:web:7ab3de7e6e0b905ed94fab"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const player = document.getElementById("player");

function embedURL(id) {
  return `https://www.youtube.com/embed/${id}?autoplay=1&controls=0`;
}

onValue(ref(db, "sites/leslive-stream"), (snap) => {
  const data = snap.val() || {};

  if (data.videoId) {
    player.src = embedURL(data.videoId);
  }

  if (data.pageTitle) {
    document.title = data.pageTitle;
  }
});
</script>

</body>
</html>
